schema_version: 1
updated_at: "2026-08-23"
contracts:
  protein-embedding:
    assumptions:
      - protein-and-genomic-embedding-contracts-are-domain-separated
      - validate-amino-acid-alphabet-before-model-download
      - preserve-fasta-identifiers-as-embedding-identifiers
      - embedding-target-and-layer-selection-must-be-explicit-in-run-summary
      - bos-and-eos-tokens-are-excluded-from-per-residue-outputs
      - default-local-backend-is-huggingface-esm2-unless-user-selects-another-family
      - hosted-biohub-execution-requires-explicit-backend-and-token-environment
    runnable_steps:
      - python skills/protein-embedding/scripts/validate_protein_fasta.py --fasta <PROTEIN_FASTA>
      - python skills/protein-embedding/scripts/run_real_protein_embedding_workflow.py --fasta <PROTEIN_FASTA> --model-family esm2 --embedding-type <PER_PROTEIN_OR_PER_RESIDUE_OR_BOTH> --dry-run --output-dir output/protein-embedding/<RUN_ID>
      - python skills/protein-embedding/scripts/run_real_protein_embedding_workflow.py --fasta <PROTEIN_FASTA> --model-family esm2 --embedding-type <PER_PROTEIN_OR_PER_RESIDUE_OR_BOTH> --output-dir output/protein-embedding/<RUN_ID>
      - awk 'NR<=180{print}' playbooks/protein-embedding/README.md
    expected_outputs:
      - plan-json:protein-embedding
      - expected-file:output/protein-embedding/<RUN_ID>/run_summary.json
      - expected-file:output/protein-embedding/<RUN_ID>/embeddings.npz
      - optional-file:output/protein-embedding/<RUN_ID>/protein_embeddings.tsv
      - optional-file:output/protein-embedding/<RUN_ID>/validation.json
    fallbacks:
      - ask-for-protein-sequence-or-fasta-and-embedding-target-if-missing
      - use-dry-run-and-small-esm2-checkpoint-before-large-model-download
      - reduce-from-per-residue-or-all-layer-output-to-per-protein-last-layer-when-memory-is-limited
      - switch-between-supported-protein-model-families-without-routing-to-genomic-embedding-skills
      - use-local-files-only-or-an-already-cached-checkpoint-when-network-access-is-unavailable
    retry_policy: clarify-protein-input-target-model-and-backend-then-dry-run-once

  protein-sequence-mutation-effect:
    assumptions:
      - protein-residue-numbering-is-1-based-and-wild-type-residues-must-match
      - sequence-and-evolutionary-model-scores-retain-native-effect-axes
      - alphamissense-is-a-precomputed-human-missense-lookup-not-arbitrary-inference
      - missing-model-assets-produce-unavailable-status-never-zero-or-fabricated-scores
    runnable_steps:
      - python skills/protein-sequence-mutation-effect/scripts/validate_protein_mutations.py --fasta <WT_FASTA> --mutations-file <MUTATIONS_TSV> --output output/protein-sequence-mutation-effect/<RUN_ID>/inputs/normalized_mutations.tsv --summary-json output/protein-sequence-mutation-effect/<RUN_ID>/inputs/validation.json
      - python skills/protein-sequence-mutation-effect/scripts/run_sequence_mutation_effect.py --fasta <WT_FASTA> --mutations-file <MUTATIONS_TSV> --models esm-1v,esmc-300m,msa-profile,poet,alphamissense --mode plan --output-dir output/protein-sequence-mutation-effect/<RUN_ID>
      - awk 'NR<=180{print}' playbooks/protein-mutation-effect/README.md
    expected_outputs:
      - plan-json:protein-sequence-mutation-effect
      - expected-file:output/protein-sequence-mutation-effect/<RUN_ID>/normalized_mutations.tsv
      - expected-file:output/protein-sequence-mutation-effect/<RUN_ID>/scores.tsv
      - expected-file:output/protein-sequence-mutation-effect/<RUN_ID>/run_summary.json
      - expected-file:output/protein-sequence-mutation-effect/<RUN_ID>/manifest.json
      - expected-file:output/protein-sequence-mutation-effect/<RUN_ID>/commands.sh
    fallbacks:
      - use-plan-mode-before-model-downloads
      - run-a-user-selected-subset-of-sequence-models
      - import-precomputed-alphamissense-poet-or-model-score-tables
      - retry-only-failed-backend-and-preserve-successful-results
    retry_policy: clarify-sequence-numbering-msa-or-model-assets-then-retry-failed-backend-once

  protein-structure-mutation-effect:
    assumptions:
      - protein-residue-numbering-is-1-based-and-wild-type-residues-must-match
      - validate-sequence-to-structure-chain-mapping-before-scoring
      - thermompnn-positive-ddg-is-destabilizing-in-canonical-output
      - proteinmpnn-and-esm-if1-likelihoods-are-proxies-not-direct-stability-measurements
      - raw-scores-from-structure-models-are-never-averaged-without-calibration
      - missing-structure-or-backend-produces-unavailable-status-never-a-fabricated-score
    runnable_steps:
      - python skills/protein-structure-mutation-effect/scripts/validate_structure_mutations.py --fasta <WT_FASTA> --structure <PDB_OR_MMCIF> --chain <CHAIN> --mutations-file <MUTATIONS_TSV> --output-dir output/protein-structure-mutation-effect/<RUN_ID>/inputs
      - python skills/protein-structure-mutation-effect/scripts/run_structure_mutation_effect.py --fasta <WT_FASTA> --structure <PDB_OR_MMCIF> --chain <CHAIN> --mutations-file <MUTATIONS_TSV> --models saprot,thermompnn,proteinmpnn,esm-if1 --mode plan --output-dir output/protein-structure-mutation-effect/<RUN_ID>
      - awk 'NR<=180{print}' playbooks/protein-mutation-effect/README.md
    expected_outputs:
      - plan-json:protein-structure-mutation-effect
      - expected-file:output/protein-structure-mutation-effect/<RUN_ID>/normalized_mutations.tsv
      - expected-file:output/protein-structure-mutation-effect/<RUN_ID>/residue_mapping.tsv
      - expected-file:output/protein-structure-mutation-effect/<RUN_ID>/structure_mutation_scores.tsv
      - expected-file:output/protein-structure-mutation-effect/<RUN_ID>/run_summary.json
      - expected-file:output/protein-structure-mutation-effect/<RUN_ID>/manifest.json
      - expected-file:output/protein-structure-mutation-effect/<RUN_ID>/commands.sh
    fallbacks:
      - ask-for-structure-and-chain-when-structure-conditioned-scoring-is-required
      - use-sequence-mutation-effect-when-no-valid-structure-mapping-is-available
      - import-precomputed-structure-model-outputs
      - retry-only-failed-backend-and-preserve-successful-results
    retry_policy: clarify-structure-chain-numbering-and-model-assets-then-retry-failed-backend-once

  protein-mutation-effect:
    assumptions:
      - protein-residue-numbering-is-1-based-and-wild-type-residues-must-match
      - sequence-structure-stability-and-human-prior-scores-remain-separate-effect-axes
      - raw-scores-from-different-models-are-never-averaged-without-explicit-calibration
      - alphamissense-is-a-precomputed-human-missense-lookup-not-arbitrary-inference
      - proteinmpnn-and-esm-if1-likelihoods-are-proxies-not-direct-stability-measurements
      - missing-model-assets-produce-unavailable-status-never-zero-or-fabricated-scores
    runnable_steps:
      - python skills/protein-mutation-effect/scripts/normalize_protein_mutations.py --fasta <WT_FASTA> --mutation <PROTEIN_ID:A42V> --output-dir output/protein-mutation-effect/<RUN_ID>/inputs
      - python skills/protein-mutation-effect/scripts/run_protein_mutation_effect.py --fasta <WT_FASTA> --mutations-file <MUTATIONS_TSV> --models esm1v,esmc-300m,msa-profile,saprot,thermompnn,poet,proteinmpnn,esm-if1,alphamissense --mode plan --output-dir output/protein-mutation-effect/<RUN_ID>
      - awk 'NR<=180{print}' playbooks/protein-mutation-effect/README.md
    expected_outputs:
      - plan-json:protein-mutation-effect
      - expected-file:output/protein-mutation-effect/<RUN_ID>/inputs/normalized_sequences.fasta
      - expected-file:output/protein-mutation-effect/<RUN_ID>/inputs/normalized_mutations.tsv
      - expected-file:output/protein-mutation-effect/<RUN_ID>/protein_mutation_scores.tsv
      - expected-file:output/protein-mutation-effect/<RUN_ID>/protein_mutation_summary.json
      - expected-file:output/protein-mutation-effect/<RUN_ID>/run_manifest.json
      - expected-file:output/protein-mutation-effect/<RUN_ID>/commands.sh
    output_columns:
      scores:
        - protein_id
        - variant_id
        - mutation_group
        - mutation
        - model_family
        - model_id
        - model_revision
        - score_name
        - effect_axis
        - native_effect_axis
        - raw_score
        - score_unit
        - higher_is
        - native_higher_is
        - status
        - error
        - source_path
    fallbacks:
      - use-plan-mode-before-model-downloads
      - run-sequence-models-when-no-structure-is-available
      - import-precomputed-alphamissense-or-external-model-scores
      - retry-only-failed-backend-and-preserve-successful-raw-results
    retry_policy: clarify-sequence-numbering-or-required-assets-then-retry-failed-backend-once
  protein-mutation-benchmark:
    assumptions:
      - proteingym-is-a-benchmark-data-and-evaluation-substrate-not-a-prediction-model
      - compare-scores-within-the-same-assay-and-directionality-convention
      - prevent-assay-protein-and-homology-leakage-in-supervised-evaluation
      - report-exclusions-and-coverage-with-every-metric
    runnable_steps:
      - python skills/protein-mutation-benchmark/scripts/run_proteingym_benchmark.py --assay-data <PROTEINGYM_CSV> --scores <PROTEIN_MUTATION_SCORES_TSV> --output-dir output/protein-mutation-benchmark/<RUN_ID>
      - awk 'NR<=180{print}' playbooks/protein-mutation-benchmark/README.md
    expected_outputs:
      - plan-json:protein-mutation-benchmark
      - expected-file:output/protein-mutation-benchmark/<RUN_ID>/metrics.tsv
      - expected-file:output/protein-mutation-benchmark/<RUN_ID>/summary.json
      - expected-file:output/protein-mutation-benchmark/<RUN_ID>/alignment_report.tsv
      - expected-file:output/protein-mutation-benchmark/<RUN_ID>/exclusions.tsv
      - expected-file:output/protein-mutation-benchmark/<RUN_ID>/run_manifest.json
    fallbacks:
      - use-a-small-explicit-assay-subset-before-downloading-the-full-release
      - report-spearman-only-when-class-labels-are-unavailable
      - import-local-proteingym-assay-files-when-network-download-is-not-approved
    retry_policy: clarify-assay-score-key-and-directionality-then-realign-once
  variant-effect:
    assumptions:
      - coordinate-convention-must-be-explicit
      - ref-alt-interpretation-limited-to-selected-model
      - explicit-compare-intent-required-for-multi-skill-composition
      - vcf-batch-manifest-normalizes-to-snp-records-with-status-tracking
      - unified-output-defaults-to-wide-table-plus-per-skill-standardized-records
      - evo2-prefers-large-window-then-adaptive-window-fallback
    runnable_steps:
      - bash scripts/run_agent.sh --task variant-effect --query {selected_skill}-variant-effect-workflow
      - awk 'NR<=120{print}' playbooks/variant-effect/README.md
      - "# Single-skill execution keeps primary skill behavior unless explicit comparison intent is present."
      - "# Explicit multi-skill: bash case-study-playbooks/variant-effect/run_variant_effect_case.sh --vcf <file.vcf> --run-id <YYYYMMDDTHHMMSSZ> --skills alphagenome,borzoi,evo2,gpn --assembly hg38 --continue-on-error 1"
    expected_outputs:
      - plan-json:variant-effect
      - expected-file:case-study-playbooks/variant-effect/<run_id>/variant_effect_case_summary.json
      - expected-file:case-study-playbooks/variant-effect/<run_id>/logs/variant_effect_case_manifest.tsv
      - expected-file:case-study-playbooks/variant-effect/<run_id>/logs/unified_variant_effect_records.tsv
      - expected-file:case-study-playbooks/variant-effect/<run_id>/logs/unified_variant_effect_records.json
      - expected-file:case-study-playbooks/variant-effect/<run_id>/alphagenome_results/alphagenome_variant_effect_records.tsv
      - expected-file:case-study-playbooks/variant-effect/<run_id>/borzoi_results/borzoi_variant_effect_records.tsv
      - expected-file:case-study-playbooks/variant-effect/<run_id>/evo2_results/evo2_variant_effect_records.tsv
      - expected-file:case-study-playbooks/variant-effect/<run_id>/gpn_results/gpn_variant_effect_records.tsv
    output_columns:
      base: [vid, chrom, position, ref, alt, variant_type, assembly, interval_start, interval_end]
      info_passthrough: all VCF INFO keys (dynamic, sorted alphabetically)
      per_tissue: ["{tissue}_mean_diff", "{tissue}_log2fc"] for each of 8 tissues
      metadata: [status, error, run_time_utc]
    tissues:
      Neuronal_stem_cell: CL:0000047
      Skeletal_Muscle: UBERON:0011907
      Whole_Blood: UBERON:0013756
      Endothelial_cell: CL:0000115
      Lung: UBERON:0002048
      Liver: UBERON:0002107
      Visceral_Adipose: UBERON:0010414
      Skin: UBERON:0036149
    fallbacks:
      - ask-for-missing-variant-spec
      - fallback-to-single-primary-skill-when-no-explicit-compare-intent
      - retry-with-network-proxy-once-if-hosted-api-times-out
    retry_policy: adaptive-window-fallback-with-timeout-proxy-retry
  embedding:
    assumptions:
      - sequence-length-and-tokenization-must-match-model
      - embedding-granularity-must-be-explicit
    runnable_steps:
      - bash case-study-playbooks/embedding/run_embedding_case.sh --bed case-study-playbooks/embedding/bed/Test.interval.bed --run-id $(date -u +%Y%m%dT%H%M%SZ) --skills all --continue-on-error 1
      - awk 'NR<=160{print}' playbooks/embedding/README.md
    expected_outputs:
      - plan-json:embedding
      - expected-file:case-study-playbooks/embedding/<run_id>/embedding_case_summary.json
      - expected-file:case-study-playbooks/embedding/<run_id>/logs/embedding_case_manifest.tsv
      - expected-file:case-study-playbooks/embedding/<run_id>/logs/embedding_intervals_manifest.tsv
      - expected-file:case-study-playbooks/embedding/<run_id>/logs/history_archive_manifest.tsv
      - expected-file:case-study-playbooks/embedding/<run_id>/dnabert2_results/interval_*/case_metadata.json
      - expected-file:case-study-playbooks/embedding/<run_id>/dnabert2_results/interval_*/*_result.json
      - expected-file:case-study-playbooks/embedding/<run_id>/evo2_results/interval_*/evo2_real_workflow_results.json
      - expected-file:case-study-playbooks/embedding/<run_id>/evo2_results/interval_*/case_metadata.json
      - expected-file:case-study-playbooks/embedding/<run_id>/ntv3_results/interval_*/*_result.json
      - expected-plot:case-study-playbooks/embedding/<run_id>/ntv3_results/interval_*/*_trackplot.png
    fallbacks:
      - switch-to-compatible-embedding-skill
    retry_policy: clarify-then-single-retry
  fine-tuning:
    assumptions:
      - dataset-schema-must-be-validated-before-training
      - evaluation-artifacts-path-must-be-defined
      - fine-tuning-mode-must-be-explicit-for-ntv3-prep-vs-train
    runnable_steps:
      - bash scripts/run_agent.sh --task fine-tuning --query {selected_skill}-fine-tuning-workflow
      - "# NTv3 prep mode: bash case-study-playbooks/fine-tuning/run_fine_tuning_case.sh --skills ntv3 --ntv3-mode prep --data-dir case-study-playbooks/fine-tuning/data"
      - "# NTv3 train mode: FINE_TUNING_NTV3_DEVICE=cpu bash case-study-playbooks/fine-tuning/run_fine_tuning_case.sh --skills ntv3 --ntv3-mode train --data-dir case-study-playbooks/fine-tuning/data"
      - awk 'NR<=120{print}' playbooks/fine-tuning/README.md
    expected_outputs:
      - plan-json:fine-tuning
      - prep:expected-file:train-command.sh
      - prep:expected-file:eval-metrics.json
      - train:expected-file:eval-metrics.json
      - train:expected-file:training_history.json
      - train:expected-file:model_output/best_checkpoint.pt
      - train:expected-file:train.log
    fallbacks:
      - clarify-ntv3-mode-then-retry
      - fallback-to-dnabert2-csv-path
      - reduce-scope-to-minimal-train-run
    retry_policy: clarify-then-single-retry
  track-prediction:
    assumptions:
      - species-and-assembly-must-be-provided
      - bed-batch-summary-is-source-of-truth-for-partial-failures
      - per-interval-artifacts-must-land-under-track-run-root
    runnable_steps:
      - bash scripts/run_agent.sh --task track-prediction --query {selected_skill}-track-prediction-workflow
      - awk 'NR<=120{print}' playbooks/track-prediction/README.md
    expected_outputs:
      - plan-json:track-prediction
      - expected-file:case-study-playbooks/track_prediction/<run_id>/alphagenome_results/alphagenome_track_bed_batch_summary.json
      - expected-file:case-study-playbooks/track_prediction/<run_id>/ntv3_results/ntv3_bed_batch_summary.json
      - expected-file:case-study-playbooks/track_prediction/<run_id>/borzoi_results/borzoi_bed_batch_summary.json
      - expected-file:case-study-playbooks/track_prediction/<run_id>/segmentnt_results/segmentnt_bed_batch_summary.json
      - expected-plot:case-study-playbooks/track_prediction/<run_id>/*_results/*_trackplot.png
      - expected-file:case-study-playbooks/track_prediction/<run_id>/*_results/*_result.json
      - expected-file:case-study-playbooks/track_prediction/<run_id>/*_results/*.log
    fallbacks:
      - fallback-to-secondary-track-skill
    retry_policy: clarify-interval-or-bed-then-per-interval-network-retry-once
  protein-structure-lookup:
    assumptions:
      - retrieval-workflow-not-de-novo-folding
      - default-organism-human-unless-user-states-otherwise
      - uniprot-reviewed-entry-preferred-then-relaxed
      - alphafold-db-absence-is-non-fatal
      - esmfold-hosted-api-sequence-length-15-to-400
      - esmfold-sequence-input-uses-canonical-amino-acid-codes-by-default
      - pymol-binary-is-optional-for-script-generation
    runnable_steps:
      - python skills/protein-structure-get/scripts/protein_structure_get.py --gene <GENE_SYMBOL> --organism human --modules all --outdir output/protein-structure/<GENE_SYMBOL>
      - python skills/protein-structure-get/scripts/protein_structure_get.py --sequence <AA_SEQUENCE> --sequence-name <LABEL> --modules esmfold --outdir output/protein-structure/<LABEL>
      - python skills/protein-structure-get/scripts/protein_structure_get.py --uniprot <ACCESSION> --modules alphafold --pymol --outdir output/protein-structure/<ACCESSION>_pymol
      - awk 'NR<=120{print}' playbooks/protein-structure-lookup/README.md
    expected_outputs:
      - plan-json:protein-structure-lookup
      - expected-file:output/protein-structure/<GENE_SYMBOL>/protein_structure_get.result.json
      - expected-file:output/protein-structure/<GENE_SYMBOL>/protein_structure_summary.tsv
      - expected-file:output/protein-structure/<GENE_SYMBOL>/<GENE_SYMBOL>.<ACCESSION>.features.tsv
      - expected-file:output/protein-structure/<GENE_SYMBOL>/<GENE_SYMBOL>.<ACCESSION>.pdb_structures.tsv
      - expected-file:output/protein-structure/<GENE_SYMBOL>/<GENE_SYMBOL>.<ACCESSION>.alphafold.tsv
      - sequence-mode:expected-file:output/protein-structure/<LABEL>/<LABEL>.esmfold.pdb
      - sequence-mode:expected-file:output/protein-structure/<LABEL>/<LABEL>.esmfold.tsv
      - sequence-mode:expected-file:output/protein-structure/<LABEL>/<LABEL>.sequence.fasta
      - optional-file:output/protein-structure/<TARGET>/<LABEL>.pymol.pml
    fallbacks:
      - ask-for-organism-or-uniprot-accession-if-gene-resolution-fails
      - ask-for-valid-15-to-400-aa-sequence-if-esmfold-input-is-invalid
      - continue-with-uniprot-and-pdb-outputs-if-alphafold-entry-is-missing
      - install-requirements-if-runtime-dependencies-are-missing
    retry_policy: clarify-organism-or-accession-then-network-retry-once
  protein-structure-visualization:
    assumptions:
      - structure-source-must-be-known-before-visualization
      - use-protein-structure-get-first-when-only-gene-symbol-is-provided
      - pocket-detection-is-heuristic-not-docking-or-binding-energy
      - conservation-and-ppi-modules-depend-on-public-network-services
      - residue-and-secondary-highlight-output-is-html-only
    runnable_steps:
      - python skills/protein-structure-visualize/scripts/protein_structure_visualize.py --pdb-id <PDB_ID> --modules all --outdir output/protein-structure-visualize/<PDB_ID>
      - python skills/protein-structure-visualize/scripts/protein_structure_visualize.py --uniprot <ACCESSION> --modules all --gene <GENE_SYMBOL> --outdir output/protein-structure-visualize/<ACCESSION>
      - python skills/protein-structure-visualize/scripts/protein_structure_visualize.py --pdb-id <PDB_ID> --modules highlight --chain <CHAIN> --highlight-residues <A:110-R,A:120-K> --highlight-secondary <helix,sheet> --outdir output/protein-structure-visualize/<PDB_ID>_highlight
      - awk 'NR<=140{print}' playbooks/protein-structure-visualization/README.md
    expected_outputs:
      - plan-json:protein-structure-visualization
      - expected-file:output/protein-structure-visualize/<TARGET>/protein_structure_visualize.result.json
      - expected-file:output/protein-structure-visualize/<TARGET>/structure_summary.tsv
      - expected-file:output/protein-structure-visualize/<TARGET>/summary.txt
      - expected-html:output/protein-structure-visualize/<TARGET>/<PREFIX>.full_view.html
      - expected-html:output/protein-structure-visualize/<TARGET>/<PREFIX>.highlight.html
      - expected-plot:output/protein-structure-visualize/<TARGET>/<PREFIX>.contact_map.png
      - expected-plot:output/protein-structure-visualize/<TARGET>/<PREFIX>.bfactor.png
      - expected-file:output/protein-structure-visualize/<TARGET>/<PREFIX>.ca_distances.tsv
    fallbacks:
      - ask-for-pdb-id-uniprot-accession-or-local-pdb-if-source-is-missing
      - run-protein-structure-get-first-if-user-provides-only-gene-symbol
      - install-requirements-if-runtime-dependencies-are-missing
      - install-dssp-or-use-pdb-with-helix-sheet-records-if-secondary-highlight-has-zero-hits
      - rerun-without-network-dependent-modules-if-hmmer-or-string-time-out
    retry_policy: clarify-structure-source-then-network-module-retry-once
  protein-structure-alignment:
    assumptions:
      - exactly-two-structure-sources-required
      - c-alpha-rigid-body-superposition-not-sequence-alignment
      - default-pairing-requires-overlapping-residue-numbering
      - chain-and-domain-selection-can-dominate-rmsd-interpretation
      - tmalign-binary-is-optional-for-tm-score
      - foldseek-binary-required-for-structure-search-or-clustering
      - remote-foldseek-web-api-does-not-require-local-foldseek-installation
      - foldseek-web-api-uploads-query-structure-to-remote-server
      - foldseek-web-results-can-be-rendered-as-local-html-report
      - ask-before-installing-foldseek-or-downloading-large-foldseek-databases
      - run-foldseek-directly-only-when-binary-query-and-target-are-available
      - similar-structure-search-with-missing-target-requires-database-choice
      - foldseek-search-and-cluster-use-external-foldseek-not-internal-rmsd-superposition
      - pae-is-an-alphafold-confidence-metric-not-an-alignment-score
      - interface-contact-map-uses-structure1-vs-aligned-structure2-not-internal-contact-maps
    runnable_steps:
