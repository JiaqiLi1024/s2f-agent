schema_version: 1
updated_at: "2026-08-23"

coordinate_conventions:
  interval:
    default: "0-based [start, end)"
    accepted:
      - "0-based [start, end)"
      - "1-based closed (must be explicit)"
  single_site:
    default: "1-based"
    accepted:
      - "1-based"
  assembly_aliases:
    hg19: GRCh37
    hg38: GRCh38
    mm10: GRCm38
    chm13: T2T-CHM13

legacy_key_map:
  sequence: sequence-or-interval
  coordinate: coordinate-or-interval
  variant-spec: ref-alt-or-variant-spec
  interval-or-variant: coordinate-or-interval
  vcf: vcf-input
  vcf-path: vcf-input
  msa: protein-msa-source
  alphamissense-table: precomputed-score-source
  model-score-table: precomputed-score-source
  model-set: protein-mutation-model-set
  adapter-mode: execution-mode
  assay-data: protein-mutation-benchmark-input
  model-scores: protein-mutation-score-input
  archive-policy: cleanup-policy
  structure: protein-structure-source
  fasta: protein-sequence-source
  mutations: protein-mutation-spec-or-table
  mutations-file: protein-mutation-spec-or-table
  scores: protein-mutation-score-input

inputs:
