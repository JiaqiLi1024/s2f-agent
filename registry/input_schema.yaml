      - stack
      - model
      - family
      - ntv3
      - evo2
      - gpn
      - alphagenome
      - borzoi
    examples:
      - "ntv3"
      - "evo2 hosted"

  - key: runtime-context
    type: string
    query_tokens:
      - linux
      - mac
      - windows
      - wsl
      - docker
      - conda
      - runtime
    examples:
      - "mac + conda"
      - "linux docker"

  - key: hardware-context
    type: string
    query_tokens:
