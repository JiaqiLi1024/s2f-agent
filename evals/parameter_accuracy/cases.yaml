schema_version: 1
updated_at: "2026-08-23"
description: >-
  Paired parameter claims. Documented cases require an exact source-grounded
  claim; unknown cases require status=unknown and evidence that the value is
  not a universal documented default. The scorer inspects structured
  parameter_claims only.
cases:
  - id: parameter_001
    query: "For $alphagenome-api track prediction, what is the documented default output head?"
    task: parameter-selection
    expected_primary_skill: alphagenome-api
    parameter_name: output_head_default
    expected_parameter_status: documented
    required_parameter_contains: [output_head_default, RNA_SEQ]
    required_evidence_contains: [skills/alphagenome-api/SKILL.md]
  - id: parameter_002
    query: "For local $alphagenome-research, what minimum Python version is documented?"
    task: parameter-selection
    expected_primary_skill: alphagenome-research
    parameter_name: python_version
    expected_parameter_status: documented
    required_parameter_contains: [python_version, ">=3.11"]
    required_evidence_contains: [skills/alphagenome-research/SKILL.md]
  - id: parameter_003
    query: "Can the disabled $basset-workflows skill be used as the default route for a new job?"
    task: parameter-selection
    expected_decision: clarify
    expected_clarify_contains: disabled
    require_parameter_claims: false
    forbid_parameter_claims: true
  - id: parameter_004
